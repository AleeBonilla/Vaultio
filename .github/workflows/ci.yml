name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vaultio
          POSTGRES_USER: vaultio
          POSTGRES_PASSWORD: vaultio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultio -d vaultio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        env:
          MINIO_ROOT_USER: vaultio
          MINIO_ROOT_PASSWORD: vaultio-demo-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vaultio:vaultio@localhost:5432/vaultio?schema=public
      VAULTIO_STORAGE_ENDPOINT: http://localhost:9000
      VAULTIO_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      VAULTIO_STORAGE_ACCESS_KEY_ID: vaultio
      VAULTIO_STORAGE_SECRET_ACCESS_KEY: vaultio-demo-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Prisma migrate deploy
        run: npm run prisma:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web

      - name: Test API
        run: npm run test:api
