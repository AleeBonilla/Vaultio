services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultio-postgres
    environment:
      POSTGRES_DB: vaultio
      POSTGRES_USER: vaultio
      POSTGRES_PASSWORD: vaultio
    ports:
      - "5432:5432"
    volumes:
      - vaultio-postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/logic.sql:/docker-entrypoint-initdb.d/02-logic.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: vaultio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vaultio
      MINIO_ROOT_PASSWORD: vaultio-demo-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - vaultio-minio-data:/data

volumes:
  vaultio-postgres-data:
  vaultio-minio-data:
